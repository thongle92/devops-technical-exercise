name: CI

# Scope: this pipeline is for the Go application only (the "service"), not
# the Helm chart or Terraform in this repo - see DECISIONS.md.
#
# SonarQube and the DefectDojo/Dependency-Track pushes need infrastructure
# this exercise doesn't have (a SonarQube host, running DefectDojo/
# Dependency-Track instances) - those steps are gated on their secrets being
# set, so they skip cleanly instead of failing on a fresh clone/fork.
# Everything else runs for real with zero extra accounts: gitleaks, semgrep
# (public ruleset), Trivy, SBOM generation, the Docker build, pushing to
# ghcr.io (uses the repo's own GITHUB_TOKEN), and Cosign keyless signing
# (GitHub OIDC against public Sigstore infra). See DECISIONS.md.
#
# Action versions are pinned to the latest verified major release as of
# 2026-08-29; production should pin by commit SHA, not tag - trivy-action
# itself had a supply chain compromise in March 2026, which is exactly the
# failure mode SHA-pinning exists to prevent.

on: push

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # `if:` conditions can't reference `secrets.*` directly (GitHub Actions
    # rejects it at parse time: "Unrecognized named-value: 'secrets'") -
    # mirror the ones we need to gate on into `env` here instead, and check
    # `env.*` in each step's `if:` below.
    env:
      SONAR_TOKEN_SET: ${{ secrets.SONAR_TOKEN != '' }}
      DEFECTDOJO_API_KEY_SET: ${{ secrets.DEFECTDOJO_API_KEY != '' }}
      DEPENDENCY_TRACK_API_KEY_SET: ${{ secrets.DEPENDENCY_TRACK_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod

      - name: go test
        run: go test ./...

      - name: lint go
        # continue-on-error, not disabled: golangci-lint finds real errcheck
        # issues in the provided app code (unchecked fmt.Fprint* return
        # values in server.go), but the brief says not to modify the app -
        # so the finding stays visible instead of blocking the pipeline or
        # being silenced. See DECISIONS.md.
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: app

      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: semgrep (SAST)
        # semgrep-action (the wrapper) is deprecated; run the CLI directly.
        # `semgrep scan` (not `semgrep ci`) so this runs standalone against
        # the public ruleset with no Semgrep account/token needed.
        run: |
          pip install semgrep
          semgrep scan --config=auto

      - name: SonarQube
        # Needs a SonarQube server (self-hosted or SonarCloud) - not
        # available in this exercise. Skips instead of failing when the
        # secret isn't set; see DECISIONS.md.
        if: ${{ env.SONAR_TOKEN_SET == 'true' }}
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Trivy CVE scan (filesystem/dependencies)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: app
          format: sarif
          output: trivy-fs-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.22.0
        with:
          path: app
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Push scan results to DefectDojo
        # Needs a running DefectDojo instance - not available in this
        # exercise. Skips instead of failing when the secret isn't set.
        if: ${{ env.DEFECTDOJO_API_KEY_SET == 'true' }}
        run: |
          curl -sS -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Trivy Scan" \
            -F "file=@trivy-fs-results.sarif"

      - name: Push SBOM to Dependency-Track
        # Needs a running Dependency-Track instance - not available in this
        # exercise. Skips instead of failing when the secret isn't set.
        if: ${{ env.DEPENDENCY_TRACK_API_KEY_SET == 'true' }}
        run: |
          curl -sS -X POST "${{ secrets.DEPENDENCY_TRACK_URL }}/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}" \
            -F "project=${{ secrets.DEPENDENCY_TRACK_PROJECT_ID }}" \
            -F "bom=@sbom.cyclonedx.json"

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless Cosign signing via OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4 # needed for the gha cache backend below

      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: app
          tags: ghcr.io/${{ github.repository }}/greeter:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/greeter:${{ github.sha }}

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to registry
        uses: docker/build-push-action@v7
        with:
          context: app
          tags: ghcr.io/${{ github.repository }}/greeter:${{ github.sha }}
          push: true
          cache-from: type=gha

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository }}/greeter:${{ github.sha }}
