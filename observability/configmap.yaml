apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/alerts.yml

    scrape_configs:
      - job_name: greeter
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # only Pods belonging to the greeter chart (any environment/namespace)
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: greeter
            action: keep
          # only the named "http" container port - avoids duplicate targets
          # if the pod ever exposes another port
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  alerts.yml: |
    groups:
      - name: greeter
        rules:
          - alert: GreeterHighErrorRate
            expr: sum(rate(greeter_http_requests_total{status="500"}[1m])) > 0
            for: 1m
            labels:
              severity: page
            annotations:
              summary: "Greeter is returning 5xx errors"
              description: "{{ $value | humanize }} req/s of 5xx responses from greeter over the last minute."
